<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050914">
<title>Star Destroyer</title>
<style>
  html, body { margin: 0; height: 100%; background: #050914; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  // ---- Welt: so gross wie das Fenster (CSS-Pixel), scharf dank devicePixelRatio ----
  let W = 800, H = 600, dpr = 1, scale = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = window.innerWidth, ch = window.innerHeight;
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    // Spielgroesse relativ zur kuerzeren Seite, damit iPad und Desktop gleich gross wirken
    scale = Math.min(cw, ch) / 600;
    W = cw / scale; H = ch / scale;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    if (stars.length === 0) initStars();
    bgCanvas = null;
    if (ship) { ship.x = Math.min(Math.max(ship.x, 20), W - 20); ship.y = Math.min(Math.max(ship.y, 20), H - 20); }
  }

  // ---- Sound (alles per WebAudio erzeugt, keine Dateien) ----
  const MUTE_KEY = "star-destroyer-muted";
  try { muted = localStorage.getItem(MUTE_KEY) === "1"; } catch (e) {}
  let actx = null, master = null, noiseBuf = null;
  function unlockAudio() {
    try {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
        master = actx.createGain(); master.gain.value = 0.35; master.connect(actx.destination);
        noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (actx.state === "suspended") actx.resume();
    } catch (e) { actx = null; }
  }
  function tone(type, f0, f1, dur, vol, delay) {
    if (!actx || muted) return;
    const t = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, cutoff) {
    if (!actx || muted) return;
    const t = actx.currentTime;
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = noiseBuf; f.type = "lowpass"; f.frequency.setValueAtTime(cutoff, t); f.frequency.exponentialRampToValueAtTime(80, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + dur + 0.02);
  }
  const sfx = {
    laser() { tone("square", 880, 220, 0.12, 0.07); },
    boom(size) { noise(0.25 + size * 0.12, 0.35 + size * 0.1, 1800 + size * 600); },
    hit() { noise(0.5, 0.6, 3000); tone("sawtooth", 160, 40, 0.5, 0.25); },
    power() { [520, 660, 880].forEach((f, i) => tone("triangle", f, f * 1.02, 0.12, 0.18, i * 0.07)); },
    shieldBreak() { tone("sine", 900, 200, 0.3, 0.25); noise(0.2, 0.2, 5000); },
    over() { [392, 330, 262, 196].forEach((f, i) => tone("sawtooth", f, f * 0.98, 0.3, 0.15, i * 0.22)); }
  };
  function setMuted(v) { muted = v; try { localStorage.setItem(MUTE_KEY, v ? "1" : "0"); } catch (e) {} }
  // Lautsprecher-Knopf oben rechts (unter den Herzen)
  function onMuteButton(wx, wy) { return wx > W - 56 && wx < W - 8 && wy > 44 && wy < 92; }

  // ---- Zustand ----
  const HS_KEY = "star-destroyer-highscore";
  let highscore = 0;
  try { highscore = parseInt(localStorage.getItem(HS_KEY) || "0", 10) || 0; } catch (e) {}
  let state = "menu"; // menu | play | pause | over
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let items = [], power = { triple: 0, shield: false }, muted = false, trailAcc = 0, bgCanvas = null, rockGrad = null, rings = [], shake = 0, scorePop = 0, lastScore = 0, newHigh = false, ship, bullets, rocks, particles, score, lives, level, spawnTimer, fireTimer, time = 0, flash = 0;
  const stars = [];

  function initStars() {
    stars.length = 0;
    for (let i = 0; i < 90; i++) stars.push({ x: Math.random() * 3000, y: Math.random() * 3000, z: [0.3, 0.3, 0.3, 0.6, 0.6, 1.0][i % 6], tw: Math.random() * 6.28 });
  }

  function reset() {
    ship = { x: W / 2, y: H * 0.8, vx: 0, vy: 0, r: 16, invuln: 2 };
    bullets = []; rocks = []; particles = []; rings = []; items = []; power = { triple: 0, shield: false }; shake = 0; scorePop = 0; lastScore = 0;
    score = 0; newHigh = false; flash = 0; lives = 3; level = 1; spawnTimer = 1; fireTimer = 0;
  }

  // ---- Eingabe: Tastatur, Maus, Touch, Gamepad ----
  const keys = {};
  const input = { tx: null, ty: null, mouseDown: false, touchActive: false, pointerX: null, pointerY: null, pad: { x: 0, y: 0, fire: false } };

  window.addEventListener("keydown", e => {
    unlockAudio();
    if (e.code === "KeyM" && !e.repeat) setMuted(!muted);
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
    keys[e.code] = true;
    if (e.repeat) return;
    if (e.code === "KeyP" || e.code === "Escape") togglePause();
    if ((e.code === "Enter" || e.code === "Space") && (state === "menu" || state === "over")) startGame();
  });
  window.addEventListener("keyup", e => { keys[e.code] = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; if (state === "play") state = "pause"; });
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") state = "pause"; });

  function toWorld(clientX, clientY) { return [clientX / scale, clientY / scale]; }

  let usingMouse = false;
  canvas.addEventListener("mousemove", e => {
    [input.pointerX, input.pointerY] = toWorld(e.clientX, e.clientY);
    // Erst bei deutlicher Mausbewegung (seit der letzten Tastatursteuerung) folgt das Schiff der Maus
    if (input.anchorX == null) { input.anchorX = input.pointerX; input.anchorY = input.pointerY; }
    if (Math.hypot(input.pointerX - input.anchorX, input.pointerY - input.anchorY) > 12) usingMouse = true;
  });
  canvas.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    unlockAudio();
    [input.pointerX, input.pointerY] = toWorld(e.clientX, e.clientY);
    if (state !== "menu" && onMuteButton(input.pointerX, input.pointerY)) { setMuted(!muted); return; }
    input.mouseDown = true;
    if (state === "menu" || state === "over") startGame();
    else if (state === "pause") state = "play";
  });
  window.addEventListener("mouseup", () => { input.mouseDown = false; });
  canvas.addEventListener("contextmenu", e => e.preventDefault());

  // Touch: Finger ziehen = Schiff folgt (mit Abstand, damit der Finger es nicht verdeckt), Schiessen automatisch
  const TOUCH_OFFSET = 70;
  function touchPoint(e) {
    const t = e.touches[0];
    [input.tx, input.ty] = toWorld(t.clientX, t.clientY);
  }
  canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    unlockAudio();
    if (state !== "menu") {
      const t0 = e.changedTouches[0], [mx, my] = toWorld(t0.clientX, t0.clientY);
      if (onMuteButton(mx, my)) { setMuted(!muted); return; }
    }
    input.touchActive = true;
    touchPoint(e);
    if (state === "menu" || state === "over") startGame();
    else if (state === "pause") state = "play";
  }, { passive: false });
  canvas.addEventListener("touchmove", e => { e.preventDefault(); if (e.touches.length) touchPoint(e); }, { passive: false });
  const touchEnd = e => { e.preventDefault(); unlockAudio(); if (e.touches.length === 0) input.touchActive = false; };
  canvas.addEventListener("touchend", touchEnd, { passive: false });
  canvas.addEventListener("touchcancel", touchEnd, { passive: false });
  // Doppeltippen-Zoom und Gesten auf iOS unterbinden
  ["gesturestart", "gesturechange", "gestureend"].forEach(n => document.addEventListener(n, e => e.preventDefault()));

  let lastPadButtons = false;
  function pollGamepad() {
    input.pad.x = 0; input.pad.y = 0; input.pad.fire = false;
    let found = false;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const p of pads) {
      if (!p || p.mapping !== "standard") continue;
      found = true;
      const dz = 0.2;
      let x = p.axes[0] || 0, y = p.axes[1] || 0;
      if (Math.abs(x) < dz) x = 0;
      if (Math.abs(y) < dz) y = 0;
      if (p.buttons[14] && p.buttons[14].pressed) x = -1;
      if (p.buttons[15] && p.buttons[15].pressed) x = 1;
      if (p.buttons[12] && p.buttons[12].pressed) y = -1;
      if (p.buttons[13] && p.buttons[13].pressed) y = 1;
      input.pad.x = x; input.pad.y = y;
      const fire = [0, 1, 2, 3, 5, 7].some(i => p.buttons[i] && p.buttons[i].pressed);
      input.pad.fire = fire;
      const start = p.buttons[9] && p.buttons[9].pressed;
      if (start && !lastPadButtons) {
        if (state === "menu" || state === "over") startGame(); else togglePause();
      }
      if (fire && (state === "menu" || state === "over") && !lastPadButtons) startGame();
      lastPadButtons = !!(start || fire);
      break;
    }
    if (!found) lastPadButtons = false;
  }

  function togglePause() {
    if (state === "play") state = "pause";
    else if (state === "pause") state = "play";
  }
  function startGame() { reset(); state = "play"; }

  // ---- Spielobjekte ----
  function spawnRock(size, x, y) {
    const radius = size === 3 ? 44 : size === 2 ? 28 : 16;
    const n = 9 + Math.floor(Math.random() * 4);
    const shape = [];
    for (let i = 0; i < n; i++) shape.push(0.75 + Math.random() * 0.4);
    const speed = (60 + Math.random() * 60 + level * 8) * (size === 1 ? 1.5 : size === 2 ? 1.2 : 1);
    const angle = Math.PI / 2 + (Math.random() - 0.5) * 0.8;
    rocks.push({
      x: x ?? Math.random() * W, y: y ?? -radius,
      vx: Math.cos(angle) * speed * (Math.random() < 0.5 ? -1 : 1) * 0.5, vy: Math.sin(angle) * speed,
      craters: [0, 1, 2].map(() => ({ a: Math.random() * 6.28, d: 0.15 + Math.random() * 0.45, s: 0.12 + Math.random() * 0.14 })),
      r: radius, size, shape, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 2
    });
  }

  function explode(x, y, n, color, ringSize) {
    n = Math.min(n, Math.max(0, 450 - particles.length));
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, s = 40 + Math.random() * 200, life = 0.4 + Math.random() * 0.6;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, color, size: 2 + Math.random() * 3 });
    }
    if (ringSize) rings.push({ x, y, r: 4, max: ringSize, life: 0.45, max_life: 0.45, color });
  }

  function shoot() {
    bullets.push({ x: ship.x - 13, y: ship.y - 10, vx: 0, vy: -620 });
    bullets.push({ x: ship.x + 13, y: ship.y - 10, vx: 0, vy: -620 });
    if (power.triple > 0) {
      bullets.push({ x: ship.x, y: ship.y - 24, vx: 0, vy: -640 });
      bullets.push({ x: ship.x - 13, y: ship.y - 10, vx: -170, vy: -590 });
      bullets.push({ x: ship.x + 13, y: ship.y - 10, vx: 170, vy: -590 });
    }
    sfx.laser();
  }

  function dropPowerup(type, x, y) { items.push({ type, x, y, vy: 90, t: 0 }); }

  // ---- Update ----
  function update(dt) {
    time += dt;
    for (const s of stars) { s.y += 30 * s.z * dt * (state === "play" ? 1 + level * 0.08 : 1); }
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    flash = Math.max(0, flash - dt);
    for (const r of rings) { r.life -= dt; r.r = r.max * (1 - r.life / r.max_life); }
    rings = rings.filter(r => r.life > 0);
    shake = Math.max(0, shake - dt * 40);
    scorePop = Math.max(0, scorePop - dt * 4);
    if (score !== lastScore) { lastScore = score; scorePop = 1; }
    if (state !== "play") return;
    // Triebwerksschweif
    if (ship.invuln <= 0 || Math.floor(time * 12) % 2) {
      trailAcc += dt * 110;
      while (trailAcc >= 1 && particles.length < 450) {
        trailAcc -= 1;
        const life = 0.25 + Math.random() * 0.2;
        particles.push({ x: ship.x + (Math.random() - 0.5) * 6, y: ship.y + 14, vx: (Math.random() - 0.5) * 30, vy: 120 + Math.random() * 80, life, max: life, color: Math.random() < 0.5 ? "#ffd166" : "#4cc9f0", size: 2 + Math.random() * 2 });
      }
      trailAcc = Math.min(trailAcc, 3);
    }

    // Bewegung: Touch folgt dem Finger, Maus folgt dem Zeiger, sonst Tastatur/Gamepad
    const speed = 380;
    let kx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    let ky = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    if (input.pad.x || input.pad.y) { kx = input.pad.x; ky = input.pad.y; }
    let target = null;
    if (input.mouseDown) usingMouse = true;
    if (input.touchActive && input.tx !== null) target = [input.tx, input.ty - TOUCH_OFFSET];
    else if (!kx && !ky && input.pointerX !== null && usingMouse) target = [input.pointerX, input.pointerY];
    if (kx || ky) {
      const len = Math.hypot(kx, ky);
      ship.x += (kx / len) * speed * dt; ship.y += (ky / len) * speed * dt;
      usingMouse = false; input.anchorX = input.pointerX; input.anchorY = input.pointerY;
    } else if (target) {
      const dx = target[0] - ship.x, dy = target[1] - ship.y;
      const k = 1 - Math.exp(-16 * dt);
      ship.x += dx * k; ship.y += dy * k;
    }
    ship.x = Math.min(Math.max(ship.x, 20), W - 20);
    ship.y = Math.min(Math.max(ship.y, 20), H - 20);
    ship.invuln = Math.max(0, ship.invuln - dt);

    // Schiessen: Leertaste, Maustaste, Gamepad, oder automatisch beim Beruehren
    const wantsFire = keys.Space || input.mouseDown || input.pad.fire || input.touchActive;
    fireTimer -= dt;
    if (wantsFire && fireTimer <= 0) { shoot(); fireTimer = 0.18; }

    // Asteroiden erscheinen, werden mit dem Level haeufiger
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      const r = Math.random();
      spawnRock(r < 0.5 ? 3 : r < 0.85 ? 2 : 1);
      spawnTimer = Math.max(0.35, 1.3 - level * 0.09) * (0.7 + Math.random() * 0.6);
    }

    power.triple = Math.max(0, power.triple - dt);
    for (const it of items) {
      it.y += it.vy * dt; it.t += dt;
      if (Math.hypot(it.x - ship.x, it.y - ship.y) < 30) {
        it.dead = true;
        if (it.type === "triple") power.triple = 10; else power.shield = true;
        explode(it.x, it.y, 14, it.type === "triple" ? "#7dff9b" : "#6cc8ff", 60);
        sfx.power();
      }
    }
    items = items.filter(it => !it.dead && it.y < H + 30);
    for (const b of bullets) { b.y += b.vy * dt; b.x += (b.vx || 0) * dt; }
    bullets = bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20);

    for (const a of rocks) { a.x += a.vx * dt; a.y += a.vy * dt; a.rot += a.vr * dt; if (a.x < -a.r) a.x = W + a.r; if (a.x > W + a.r) a.x = -a.r; }
    rocks = rocks.filter(a => a.y < H + a.r + 20);

    // Treffer: Schuss gegen Asteroid
    for (const b of bullets) {
      for (const a of rocks) {
        if (a.dead || b.dead) continue;
        if (Math.hypot(a.x - b.x, a.y - b.y) < a.r) {
          b.dead = true; a.dead = true;
          score += a.size === 3 ? 20 : a.size === 2 ? 50 : 100;
          explode(a.x, a.y, 10 + a.size * 4, "#ffb347", a.r * 2.2); sfx.boom(a.size);
          if (Math.random() < (a.size === 1 ? 0.06 : 0.12)) dropPowerup(Math.random() < 0.55 ? "triple" : "shield", a.x, a.y); if (!reduceMotion) shake = Math.max(shake, a.size === 3 ? 6 : 2);
          if (a.size > 1) { spawnRock(a.size - 1, a.x - 8, a.y); spawnRock(a.size - 1, a.x + 8, a.y); }
          level = 1 + Math.floor(score / 500);
        }
      }
    }
    bullets = bullets.filter(b => !b.dead);
    rocks = rocks.filter(a => !a.dead);

    // Treffer: Asteroid gegen Schiff
    if (ship.invuln <= 0) {
      for (const a of rocks) {
        if (Math.hypot(a.x - ship.x, a.y - ship.y) < a.r * 0.85 + ship.r * 0.7) {
          a.dead = true;
          if (power.shield) {
            power.shield = false; ship.invuln = 1;
            explode(a.x, a.y, 16, "#6cc8ff", 90); sfx.shieldBreak();
            break;
          }
          sfx.hit();
          explode(ship.x, ship.y, 40, "#7fd4ff", 120);
          explode(a.x, a.y, 12, "#ffb347");
          lives--; flash = 0.25; ship.invuln = 2; if (!reduceMotion) shake = 14;
          if (lives <= 0) {
            state = "over"; sfx.over();
            if (score > highscore) {
              highscore = score; newHigh = true;
              try { localStorage.setItem(HS_KEY, String(highscore)); } catch (e) {}
            }
          }
          break;
        }
      }
      rocks = rocks.filter(a => !a.dead);
    }

  }

  // ---- Zeichnen ----
  function drawShip() {
    if (ship.invuln > 0 && Math.floor(time * 12) % 2 === 0) return;
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.shadowColor = "#4cc9f0"; ctx.shadowBlur = 16;
    // Triebwerksflammen (zwei Duesen)
    for (const ex of [-9, 9]) {
      const fl = 14 + Math.random() * 10;
      const fg = ctx.createLinearGradient(0, 18, 0, 18 + fl);
      fg.addColorStop(0, "#ffffff"); fg.addColorStop(0.4, "#ffd166"); fg.addColorStop(1, "rgba(255,90,40,0)");
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.moveTo(ex - 4, 18); ctx.lineTo(ex, 18 + fl); ctx.lineTo(ex + 4, 18); ctx.fill();
    }
    ctx.shadowBlur = 0;
    // Fluegel (hinten, dunkler)
    const wg = ctx.createLinearGradient(-28, 0, 28, 0);
    wg.addColorStop(0, "#44526b"); wg.addColorStop(0.5, "#7d8fae"); wg.addColorStop(1, "#44526b");
    ctx.fillStyle = wg; ctx.strokeStyle = "#a9c4ff"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-6, -4); ctx.lineTo(-28, 14); ctx.lineTo(-27, 20); ctx.lineTo(-10, 16);
    ctx.lineTo(10, 16); ctx.lineTo(27, 20); ctx.lineTo(28, 14); ctx.lineTo(6, -4);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Kanonen an den Fluegeln
    ctx.fillStyle = "#cfd8e8";
    ctx.fillRect(-15, -12, 4, 18); ctx.fillRect(11, -12, 4, 18);
    // Triebwerksgondeln
    ctx.fillStyle = "#56627a";
    for (const ex of [-9, 9]) { ctx.beginPath(); ctx.rect(ex - 5, 4, 10, 15); ctx.fill(); ctx.stroke(); }
    // Rumpf
    const bg = ctx.createLinearGradient(-8, 0, 8, 0);
    bg.addColorStop(0, "#9fb4d6"); bg.addColorStop(0.5, "#ffffff"); bg.addColorStop(1, "#9fb4d6");
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(0, -28); ctx.quadraticCurveTo(8, -12, 8, 6); ctx.lineTo(5, 18); ctx.lineTo(-5, 18); ctx.lineTo(-8, 6);
    ctx.quadraticCurveTo(-8, -12, 0, -28);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Cockpit
    const cg = ctx.createLinearGradient(0, -16, 0, -2);
    cg.addColorStop(0, "#bdf3ff"); cg.addColorStop(1, "#1f7ad6");
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.ellipse(0, -9, 3.6, 7, 0, 0, 6.2832); ctx.fill();
    // Blinklichter an den Fluegelspitzen
    ctx.fillStyle = Math.floor(time * 3) % 2 ? "#ff5f6d" : "#7dff9b";
    ctx.beginPath(); ctx.arc(-27, 16, 2, 0, 6.2832); ctx.arc(27, 16, 2, 0, 6.2832); ctx.fill();
    // Schutzschild
    if (power.shield) {
      ctx.strokeStyle = `rgba(108,200,255,${0.6 + 0.3 * Math.sin(time * 8)})`; ctx.lineWidth = 3;
      ctx.shadowColor = "#6cc8ff"; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(0, 0, 34, 0, 6.2832); ctx.stroke();
      ctx.fillStyle = "rgba(108,200,255,0.12)"; ctx.fill();
    }
    ctx.restore();
  }

  function drawItems() {
    for (const it of items) {
      const col = it.type === "triple" ? "#7dff9b" : "#6cc8ff";
      const pulse = 1 + 0.12 * Math.sin(it.t * 8);
      ctx.save(); ctx.translate(it.x, it.y); ctx.scale(pulse, pulse);
      ctx.shadowColor = col; ctx.shadowBlur = 14;
      ctx.fillStyle = "rgba(5,9,20,0.75)"; ctx.strokeStyle = col; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 16, 0, 6.2832); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0; ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 2.5;
      if (it.type === "triple") {
        for (const a of [-0.6, 0, 0.6]) { ctx.beginPath(); ctx.moveTo(0, 7); ctx.lineTo(Math.sin(a) * 11, 7 - Math.cos(a) * 14); ctx.stroke(); }
      } else {
        ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(8, -5); ctx.lineTo(7, 3); ctx.quadraticCurveTo(0, 11, 0, 11); ctx.quadraticCurveTo(0, 11, -7, 3); ctx.lineTo(-8, -5); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawSpeaker() {
    const x = W - 32, y = 68;
    ctx.save(); ctx.translate(x, y);
    ctx.globalAlpha = 0.85; ctx.fillStyle = "#b9c6ff"; ctx.strokeStyle = "#b9c6ff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-9, -4); ctx.lineTo(-4, -4); ctx.lineTo(2, -9); ctx.lineTo(2, 9); ctx.lineTo(-4, 4); ctx.lineTo(-9, 4); ctx.closePath(); ctx.fill();
    if (muted) { ctx.strokeStyle = "#ff5f6d"; ctx.beginPath(); ctx.moveTo(6, -5); ctx.lineTo(14, 5); ctx.moveTo(14, -5); ctx.lineTo(6, 5); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(2, 0, 6, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(2, 0, 11, -0.9, 0.9); ctx.stroke(); }
    ctx.restore();
  }

  function drawRock(a) {
    ctx.save();
    ctx.translate(a.x, a.y); ctx.rotate(a.rot);
    ctx.beginPath();
    for (let i = 0; i < a.shape.length; i++) {
      const ang = (i / a.shape.length) * 6.2832;
      const rr = a.r * a.shape[i];
      const px = Math.cos(ang) * rr, py = Math.sin(ang) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    if (!rockGrad) {
      rockGrad = ctx.createRadialGradient(-0.35, -0.35, 0.1, 0, 0, 1.1);
      rockGrad.addColorStop(0, "#8d8b8a"); rockGrad.addColorStop(0.45, "#4a4745"); rockGrad.addColorStop(1, "#181615");
    }
    ctx.save(); ctx.scale(a.r, a.r); ctx.fillStyle = rockGrad; ctx.fill(); ctx.restore();
    ctx.strokeStyle = "#9a6a47"; ctx.lineWidth = 2; ctx.stroke();
    // Krater (dunkel) und Rostflecken (orangebraun), wie bei einem echten Eisenmeteoriten
    a.craters.forEach((c, i) => {
      ctx.fillStyle = i === 0 ? "rgba(176,92,40,0.55)" : "rgba(0,0,0,0.35)";
      ctx.beginPath(); ctx.arc(Math.cos(c.a) * a.r * c.d, Math.sin(c.a) * a.r * c.d, a.r * c.s, 0, 6.2832); ctx.fill();
    });
    ctx.fillStyle = "rgba(200,205,215,0.35)";
    ctx.beginPath(); ctx.arc(-a.r * 0.38, -a.r * 0.4, a.r * 0.1, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  function text(str, x, y, size, color, align, glow) {
    ctx.font = `bold ${size}px -apple-system, system-ui, sans-serif`;
    ctx.fillStyle = color || "#fff"; ctx.textAlign = align || "center";
    if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 14; }
    ctx.fillText(str, x, y);
    ctx.shadowBlur = 0;
  }

  function buildBackground() {
    const w = Math.max(2, Math.round(window.innerWidth / 4)), h = Math.max(2, Math.round(window.innerHeight / 4));
    bgCanvas = document.createElement("canvas"); bgCanvas.width = w; bgCanvas.height = h;
    const c = bgCanvas.getContext("2d");
    const bg = c.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, "#02040c"); bg.addColorStop(1, "#0a1030");
    c.fillStyle = bg; c.fillRect(0, 0, w, h);
    c.globalCompositeOperation = "lighter";
    for (const [bx, by, br, col, al] of [[0.25, 0.3, 0.7, "120,60,200", 0.16], [0.75, 0.65, 0.8, "40,110,220", 0.15], [0.5, 0.95, 0.6, "220,60,150", 0.10]]) {
      const x = w * bx, y = h * by, r = Math.max(w, h) * br * 0.6;
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${col},${al})`); g.addColorStop(1, `rgba(${col},0)`);
      c.fillStyle = g; c.fillRect(0, 0, w, h);
    }
  }

  function drawNebula() {
    if (!bgCanvas) buildBackground();
    const dx = reduceMotion ? 0 : Math.sin(time * 0.12) * W * 0.03, dy = reduceMotion ? 0 : Math.cos(time * 0.09) * H * 0.03;
    ctx.drawImage(bgCanvas, -W * 0.05 + dx, -H * 0.05 + dy, W * 1.1, H * 1.1);
  }

  function drawHeart(x, y, size, fill) {
    ctx.save(); ctx.translate(x, y); ctx.scale(size, size);
    ctx.beginPath();
    ctx.moveTo(0, 0.35); ctx.bezierCurveTo(-1, -0.3, -0.5, -1, 0, -0.45); ctx.bezierCurveTo(0.5, -1, 1, -0.3, 0, 0.35);
    ctx.fillStyle = fill ? "#ff5f6d" : "rgba(255,95,109,0.2)";
        ctx.fill(); ctx.restore();
  }

  function draw() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    drawNebula();
    for (const s of stars) {
      const x = s.x % W, y = s.y % H;
      const tw = reduceMotion ? 1 : 0.7 + 0.3 * Math.sin(time * 3 + s.tw);
      ctx.fillStyle = `rgba(${s.z > 0.9 ? "190,225,255" : "255,255,255"},${(0.3 + s.z * 0.55) * tw})`;
      ctx.fillRect(x, y, s.z * 2.2, s.z * 2.2);
    }
    ctx.save();
    if (shake > 0 && !reduceMotion) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    if (state === "menu") {
      ctx.restore();
      const tg = ctx.createLinearGradient(W / 2 - 220, 0, W / 2 + 220, 0);
      tg.addColorStop(0, "#4cc9f0"); tg.addColorStop(0.5, "#b388ff"); tg.addColorStop(1, "#ff7eb6");
      text("STAR DESTROYER", W / 2, H * 0.32, 56, tg, "center", "#7f6bff");
      text("Weiche Asteroiden aus und schiesse sie kaputt!", W / 2, H * 0.32 + 44, 20, "#cfd8e8");
      text("Tippen, Klicken oder Leertaste zum Starten", W / 2, H * 0.55, 24, "#ffd166");
      text("Touch: Finger ziehen (schiesst automatisch)", W / 2, H * 0.55 + 56, 17, "#9fb0c8");
      text("Maus: bewegen, Klick = schiessen", W / 2, H * 0.55 + 82, 17, "#9fb0c8");
      text("Tastatur: Pfeile/WASD, Leertaste = schiessen, P = Pause", W / 2, H * 0.55 + 108, 17, "#9fb0c8");
      text("Gamepad: Stick/Steuerkreuz, A = schiessen, Start = Pause", W / 2, H * 0.55 + 134, 17, "#9fb0c8");
      text("Ton an/aus: M-Taste oder Lautsprecher-Symbol im Spiel", W / 2, H * 0.55 + 160, 17, "#9fb0c8");
      if (highscore) text("Highscore: " + highscore, W / 2, H * 0.55 + 204, 20, "#fff");
      return;
    }
    for (const a of rocks) drawRock(a);
    drawItems();
    ctx.save();
    ctx.fillStyle = "rgba(255,61,90,0.3)";
    for (const b of bullets) ctx.fillRect(b.x - 5, b.y - 12, 10, 22);
    ctx.fillStyle = "#ff8a9a";
    for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 9, 4, 16);
    ctx.restore();
    ctx.globalCompositeOperation = "lighter";
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    for (const r of rings) {
      ctx.globalAlpha = Math.max(0, r.life / r.max_life) * 0.8;
      ctx.strokeStyle = r.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 6.2832); ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    if (state !== "over") drawShip();
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = `rgba(255,80,80,${flash * 1.2})`; ctx.fillRect(0, 0, W, H); }

    // HUD
    text("PUNKTE " + score, 16, 32, 22 + scorePop * 6, "#fff", "left");
    text("LEVEL " + level, W / 2, 30, 18, "#b9c6ff", "center");
    drawSpeaker();
    if (power.triple > 0) text("3-FACH " + Math.ceil(power.triple) + "s", 16, H - 18, 16, "#7dff9b", "left");
    if (power.shield) text("SCHILD", 16, H - (power.triple > 0 ? 40 : 18), 16, "#6cc8ff", "left");
    for (let i = 0; i < 3; i++) drawHeart(W - 28 - (2 - i) * 30, 26, 11, i < lives);
    text("Highscore: " + Math.max(highscore, score), 16, 56, 15, "#9fb0c8", "left");

    if (state === "pause") {
      ctx.fillStyle = "rgba(5,9,20,0.6)"; ctx.fillRect(0, 0, W, H);
      text("PAUSE", W / 2, H / 2, 48, "#fff");
      text("Tippen, Klicken oder P zum Weiterspielen", W / 2, H / 2 + 40, 20, "#cfd8e8");
    }
    if (state === "over") {
      ctx.fillStyle = "rgba(5,9,20,0.65)"; ctx.fillRect(0, 0, W, H);
      text("GAME OVER", W / 2, H / 2 - 20, 54, "#ff5f6d");
      text("Punkte: " + score + (newHigh ? "  (neuer Highscore!)" : ""), W / 2, H / 2 + 24, 24, "#fff");
      text("Tippen, Klicken oder Leertaste fuer nochmal", W / 2, H / 2 + 68, 20, "#ffd166");
    }
  }

  // ---- Hauptschleife ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    pollGamepad();
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 200));
  reset();
  resize();
  // Fuer automatische Tests
  window.__game = { get state() { return state; }, get score() { return score; }, get lives() { return lives; }, get ship() { return ship; }, get rocks() { return rocks; }, get power() { return power; }, get items() { return items; }, dropPowerup, spawnRock, get muted() { return muted; }, get bullets() { return bullets; }, get W() { return W; }, get H() { return H; } };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
